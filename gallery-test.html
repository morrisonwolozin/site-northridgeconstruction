<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery Test — Northridge Construction</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- GLightbox -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
  <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>

  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background: #e8eae6;
      color: #1e2a26;
      -webkit-font-smoothing: antialiased;
      margin: 0;
    }

    /* ── Project grid ─────────────────────────────── */
    .project-card {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4/3;
      cursor: pointer;
      background: #d1d8d4;
    }
    .project-card img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
      display: block;
    }
    .project-card:hover img { transform: scale(1.04); }

    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(30,42,38,0.90) 0%, rgba(30,42,38,0.15) 60%, transparent 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex; align-items: flex-end;
      padding: 1.5rem;
    }
    .project-card:hover .card-overlay { opacity: 1; }
    .card-overlay .card-eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 0.35rem;
    }
    .card-overlay .card-title {
      font-family: 'DM Sans';
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 0.3rem;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .card-overlay .card-sub {
      font-size: 0.75rem;
      font-weight: bold;
      color: rgba(244,245,243,0.7);
      margin-top: 0.1rem;
    }

    /* Camera icon — signals clickable gallery */
    .gallery-badge {
      position: absolute; top: 0.75rem; right: 0.75rem;
      background: rgba(30,42,38,0.65);
      color: rgba(244,245,243,0.85);
      font-size: 0.65rem;
      letter-spacing: 0.07em;
      padding: 0.25rem 0.5rem;
      display: flex; align-items: center; gap: 0.3rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .project-card:hover .gallery-badge { opacity: 1; }
    .gallery-badge.hero-only { display: none; } /* hide if no gallery */

    /* Filter buttons */
    .filter-btn {
      font-size: 0.75rem; font-weight: 500;
      letter-spacing: 0.07em; text-transform: uppercase;
      padding: 0.4rem 1rem;
      border: 1px solid #3a4a44; color: #3a4a44;
      background: transparent; transition: all 0.2s ease; cursor: pointer;
    }
    .filter-btn:hover, .filter-btn.active {
      background: #3d6b5a; border-color: #3d6b5a; color: #fff;
    }

    /* Hidden GLightbox anchor — invisible trigger links */
    .glightbox-hidden {
      position: absolute; width: 0; height: 0;
      overflow: hidden; pointer-events: none;
    }

    .glightbox-clean .gdesc-inner { padding: 1rem 1.5rem; }
    .glightbox-clean .gslide-title {
      
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e2a26;
      margin-bottom: 0.25rem;
    }
    .glightbox-clean .gslide-desc {
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e2a26;
    }

    /* Section eyebrow */
    .eyebrow {
      font-size: 0.7rem; font-weight: bold;
      letter-spacing: 0.14em; text-transform: uppercase; color: #3d6b5a;
      margin-bottom: 0.75rem;
    }
    .section-title {
      font-size: clamp(1.75rem, 3vw, 2.5rem);
      font-weight: 700; color: #1e2a26; line-height: 1.2;
    }
    .section-rule {
      width: 2.5rem; height: 2px;
      background: #3d6b5a; margin: 1.25rem 0 1.75rem;
    }

    /* Image missing fallback */
    .img-missing {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #d1d8d4;
      color: rgba(30,42,38,0.3); font-size: 0.75rem;
      text-align: center; padding: 1rem;
    }
  </style>
</head>
<body>

<section style="padding:4rem 1.5rem;">
  <div style="max-width:1280px; margin:0 auto;">

    <div style="display:flex;flex-direction:column;gap:0;" class="mb-10">
      <p class="eyebrow">Portfolio</p>
      <h2 class="section-title">Selected Projects</h2>
      <div class="section-rule"></div>
    </div>

    <!-- Filter buttons -->
    <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:2rem;">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="current">Current</button>
      <button class="filter-btn" data-filter="new-construction">New Construction</button>
      <button class="filter-btn" data-filter="renovation">Renovation</button>
    </div>

    <!-- Project grid — built by JS -->
    <div id="project-grid"
      style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#d1d8d4;">
    </div>

    <!-- Hidden GLightbox anchor pool — one set per project -->
    <div id="lightbox-anchors" class="glightbox-hidden" aria-hidden="true"></div>

  </div>
</section>

<script type="module">
// ── Import project data ───────────────────────────────────────────
import { projectsGrid } from './assets/js/projects.js';

// ── Build grid ────────────────────────────────────────────────────
const grid    = document.getElementById('project-grid');
const anchors = document.getElementById('lightbox-anchors');

projectsGrid.forEach(project => {
  const hasGallery = project.gallery && project.gallery.length > 0;
  const galleryId  = `gallery-${project.id}`;

  // ── Card ───────────────────────────────────────────────────────
  const card = document.createElement('div');
  card.className   = 'project-card';
  card.dataset.status = project.status;
  card.dataset.type   = project.type;

  // Type label for display
  const typeLabel = {
    'current':          'Current',
    'new-construction': 'New Construction',
    'renovation':       'Renovation',
  }[project.type] || project.type;

  const details = [
      project.conditioned_area ? `${project.conditioned_area.toLocaleString()} SF` : null,
      project.bedrooms ? `${project.bedrooms} bed`            : null,
      project.bathrooms? `${project.bathrooms} bath`          : null,
    ].filter(Boolean).join(' · ');
    
  const eyebrow1 = [project.year,project.location ].filter(Boolean).join(' · ')
  const eyebrow2 = [ details].filter(Boolean).join(' · ')

  card.innerHTML = `
    <img
      src="${project.hero}"
      alt="${project.name} — ${project.location}"
      loading="lazy"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
    />
    <div class="img-missing" style="display:none;">
      ${project.name}<br/><span style="font-size:0.65rem;">${project.hero.split('/').pop()}</span>
    </div>

    <div class="card-overlay">
      <div>
        <p class="card-title">${project.name}</p>
        <p class="card-eyebrow">${typeLabel} · ${eyebrow1}</p>
        <p class="card-eyebrow"> ${eyebrow2}</p>
        ${project.delivery_url
          ? `<p class="card-eyebrow" style="margin-top:0.4rem;">
          <a href="${project.delivery_url}"
              style="color:#ffffff;text-decoration:none; rgba(255,255,255,0.95);"
              onclick="event.stopPropagation();">
            View Cost Estimate →
            </a>
          </p>`
          : ''}
        ${hasGallery
          ? `<p class="card-sub">View ${project.gallery.length + 1} photos</p>`
          : ''}
      </div>
    </div>
    ${hasGallery
      ? `<div class="gallery-badge">
           <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
             <rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.25"/>
             <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.25"/>
             <path d="M5 3l1.5-2h3L11 3" stroke="currentColor" stroke-width="1.25"/>
           </svg>
           ${project.gallery.length + 1}
         </div>`
      : ''}
  `;

  // Click behaviour
  if (hasGallery) {
    // Open GLightbox at first image of this project's gallery
    card.style.cursor = 'pointer';
    card.addEventListener('click', () => {
      const firstAnchor = document.querySelector(`a[data-gallery="${galleryId}"]`);
      if (firstAnchor) firstAnchor.click();
    });
  } else if (project.delivery_url) {
    card.style.cursor = 'pointer';
    card.addEventListener('click', () => {
      window.location.href = project.delivery_url;
    });
  }
  // else: no interaction — hero image only

  grid.appendChild(card);

  // ── Hidden GLightbox anchors for this project ──────────────────
  // Hero image is first in the lightbox sequence
  if (hasGallery) {
    const heroAnchor = document.createElement('a');
    heroAnchor.href             = project.hero;
    heroAnchor.className        = 'glightbox';
    heroAnchor.dataset.gallery  = galleryId;
    heroAnchor.dataset.title    = `${project.name} — ${project.location}`;
    heroAnchor.dataset.description = `${project.year}`;
    anchors.appendChild(heroAnchor);

    // Gallery images follow
    project.gallery.forEach(img => {
      const a = document.createElement('a');
      a.href             = img.src;
      a.className        = 'glightbox';
      a.dataset.gallery  = galleryId;
      a.dataset.title    = `${project.name} — ${project.location}`;
      a.dataset.description = img.caption || '';
      anchors.appendChild(a);
    });
  }
});

// ── Init GLightbox ────────────────────────────────────────────────
const lightbox = GLightbox({
  selector:    '.glightbox',
  touchNavigation: true,
  loop:        true,
  autoplayVideos: false,
  openEffect:  'fade',
  closeEffect: 'fade',
  cssEfects: {
    fade: { in: 'fadeIn', out: 'fadeOut' },
  },
  slideExtraAttributes: { loading: 'lazy' },
});

// ── Filter buttons ────────────────────────────────────────────────
const filterBtns = document.querySelectorAll('.filter-btn');
const cards      = document.querySelectorAll('.project-card');

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filter = btn.dataset.filter;
    cards.forEach(card => {
      const show = filter === 'all'
        || (filter === 'current'          && card.dataset.status === 'current')
        || (filter === 'new-construction' && card.dataset.type   === 'new-construction')
        || (filter === 'renovation'       && card.dataset.type   === 'renovation');
      card.style.display = show ? 'block' : 'none';
    });
  });
});
</script>

</body>
</html>
